[package]
name         = "ethereum-light-client-proto"
edition      = "2021"
version      = "0.1.0"

[lib]
name = "ethereum_light_client_proto"
path = "src/lib.rs"
doctest = false

[package.metadata.docs.rs]
all-features = true

[dependencies]
prost     = { version = "0.11", default-features = false, features = ["prost-derive"] }
ibc-proto = { version = "0.26.0", default-features = false }

[features]
default = ["std"]
std     = []
