[package]
name = "ethereum-light-client-types"
version = "0.2.1"
edition = "2021"

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2.0", default-features = false }
rlp = { version = "0.5.2", default-features = false }
tiny-keccak = { version = "2.0.2", default-features = false }
ssz-rs = { git = "https://github.com/bluele/ssz_rs", branch = "serde-no-std", default-features = false, features = ["serde"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

ethereum-light-client-proto = { path = "../proto", default-features = false }

# ethereum-light-client-rs
ethereum-consensus = { git = "https://github.com/yoshidan/ethereum-light-client-rs", rev = "fd7fe9ac107ef182b5b6e6600be54f794a247156", default-features = false }
ethereum-light-client-verifier = { git = "https://github.com/yoshidan/ethereum-light-client-rs", rev = "fd7fe9ac107ef182b5b6e6600be54f794a247156", default-features = false }


[dev-dependencies]
hex-literal = "0.4"
ethereum-light-client-verifier = { git = "https://github.com/yoshidan/ethereum-light-client-rs", rev = "fd7fe9ac107ef182b5b6e6600be54f794a247156", default-features = false, features = ["test-utils"] }
