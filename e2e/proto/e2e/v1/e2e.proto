syntax = "proto3";
package e2e.v1;

import "ibc/lightclients/ethereum/v1/ethereum.proto";

option go_package = "github.com/datachainlab/ethereum-light-client-types/e2e/client/pb";

// Verifier runs the header verification flow of an Ethereum light client
// (the equivalent of ethereum-elc's check_header_and_update_state
// verification steps) against prover-generated updates.
service Verifier {
  rpc VerifyUpdate(VerifyUpdateRequest) returns (VerifyUpdateResponse);
}

message VerifyUpdateRequest {
  // ------ chain / client config ------
  uint32 sync_committee_size = 1; // 32 (minimal) or 512 (mainnet)
  bytes genesis_validators_root = 2;
  uint64 min_sync_committee_participants = 3;
  uint64 genesis_time = 4;
  ibc.lightclients.ethereum.v1.ForkParameters fork_parameters = 5;
  uint64 seconds_per_slot = 6;
  uint64 slots_per_epoch = 7;
  uint64 epochs_per_sync_committee_period = 8;
  uint64 trust_level_numerator = 9;
  uint64 trust_level_denominator = 10;
  uint64 trusting_period_secs = 11;
  uint64 max_clock_drift_secs = 12;
  bytes ibc_address = 13; // 20 bytes

  // ------ trusted consensus state ------
  uint64 trusted_slot = 14;
  bytes trusted_current_sync_committee = 15; // aggregate pubkey
  bytes trusted_next_sync_committee = 16;    // aggregate pubkey
  uint64 trusted_timestamp_secs = 17;

  // ------ header ------
  ibc.lightclients.ethereum.v1.SyncCommittee sync_committee = 18; // trusted committee keys
  bool is_next = 19;
  ibc.lightclients.ethereum.v1.ConsensusUpdate consensus_update = 20;
  ibc.lightclients.ethereum.v1.ExecutionUpdate execution_update = 21;
  ibc.lightclients.ethereum.v1.AccountUpdate account_update = 22;
  uint64 header_timestamp_secs = 23;

  // ------ host ------
  uint64 now_secs = 24;
}

message VerifyUpdateResponse {
  uint64 finalized_slot = 1;
  uint64 latest_execution_block_number = 2;
  // aggregate pubkeys of the sync committees after applying the update
  bytes current_sync_committee = 3;
  bytes next_sync_committee = 4;
}
